services:
    mysql:
      restart: unless-stopped
      image: mysql:8.0
      environment:
        MYSQL_ROOT_PASSWORD: hands_on_root_pass
        MYSQL_DATABASE: hands_on_db
        MYSQL_USER: hands_on_user
        MYSQL_PASSWORD: hands_on_password
      ports:
      - "3309:3306"
      volumes:
      - mysql_data:/var/lib/mysql
      networks:
      - hands_on_network

    
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        restart: unless-stopped
        environment:
          PMA_HOST: mysql
          PMA_USER: hands_on_user
          PMA_PASSWORD: hands_on_password
        ports:
        - "8080:80"
        depends_on:
        - mysql
        networks:
        - hands_on_network

volumes:
 mysql_data:

networks:
 hands_on_network: